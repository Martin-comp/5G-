<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>打开说明 - 5G数字教材静态版</title>
  <style>
    body{margin:0;padding:48px;background:#eff6f3;color:#14232a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;line-height:1.8}
    main{max-width:880px;margin:auto;padding:34px 40px;border:1px solid #dbeae7;border-radius:18px;background:#fff;box-shadow:0 14px 34px rgba(32,103,89,.1)}

<body>
  <main>
    <h1>5G网络优化数字教材静态预览版</h1>
    <p>这个版本不需要运行 <span class="code">npm run dev</span>。建议把整个文件夹上传到任意静态网站托管、学校平台或本地静态服务器后访问。</p>
    <p class="note">如果直接双击本地 HTML，部分浏览器可能因为安全限制拦截 Next.js 静态资源。最稳妥的方式是上传到静态托管，或用系统自带/编辑器提供的静态预览打开。</p>
