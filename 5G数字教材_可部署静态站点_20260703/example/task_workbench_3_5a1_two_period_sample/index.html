<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>5G网络优化结果验证</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="topbar">
    <div>
      <p class="crumb">整书 / 项目四 / 任务2</p>
      <h1>5G网络优化结果验证</h1>
    </div>
    <div class="topbar-actions">
      <a class="back-link" href="../index.html">返回整书首页</a>
      <nav class="top-tabs" aria-label="任务内视图">
        <button type="button" class="top-tab active" data-view="student">学生学习</button>
        <button type="button" class="top-tab" data-view="teacher">任务组织</button>
        <button type="button" class="top-tab" data-view="resources">任务资源</button>
      </nav>
    </div>
  </header>

  <main>
    <section id="studentView" class="view active"></section>
    <section id="teacherView" class="view"></section>
    <section id="resourcesView" class="view"></section>
  </main>

  <dialog id="mapDialog" class="map-dialog">
    <div class="dialog-head">
      <div>
        <p class="eyebrow">本任务局部图谱</p>
        <h2>从课程主链到本任务节点</h2>
      </div>
      <button type="button" id="closeMap" class="icon-button" aria-label="关闭本任务局部图谱">×</button>
    </div>
    <div id="mapBody" class="map-body"></div>
  </dialog>

  <script src="./data.js"></script>
  <script src="./app.js"></script>
</body>
</html>
